<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPPT SAMOTO 100A MONITORING</title>
  <link rel="manifest" href="manifest-samoto.json">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --lcd-bg: #00d2ff;
      --lcd-text: #002b5c;
      --lcd-text-dim: rgba(0, 43, 92, 0.25);
      --case-bg: #0c152b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--case-bg); font-family: 'Share Tech Mono', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; color: #ffffff; }
    .mppt-case { width: 100%; max-width: 540px; background: linear-gradient(135deg, #101c36 0%, #080d1a 100%); border: 6px solid #04070f; border-radius: 16px; padding: 30px 20px 25px 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); position: relative; }
    .lcd-screen { background-color: var(--lcd-bg); color: var(--lcd-text); border: 8px solid #000000; border-radius: 4px; padding: 16px 14px; box-shadow: inset 0 0 20px rgba(0, 43, 92, 0.5); text-transform: uppercase; letter-spacing: 0.5px; }
    .lcd-row-top { display: flex; justify-content: space-between; font-size: 21px; font-weight: bold; line-height: 1.2; margin-bottom: 8px; }
    .lcd-row-subtop { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 12px; padding-left: 35px; padding-right: 5px; }
    .lcd-diagram-area { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 20px 0; position: relative; height: 100px; }
    .pv-block { display: flex; flex-direction: column; gap: 5px; }
    .pv-element { display: flex; gap: 3px; }
    .pv-cell { width: 10px; height: 7px; border: 1.5px solid var(--lcd-text); }
    .mppt-center-box { border: 2px solid var(--lcd-text); padding: 6px 14px; text-align: center; font-size: 20px; font-weight: bold; position: relative; background-color: transparent; }
    .mppt-center-box::after { content: ""; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); width: 2px; height: 15px; background-color: var(--lcd-text); }
    .mppt-internal-lines { display: flex; justify-content: center; gap: 4px; margin-top: 3px; }
    .mppt-line-segment { width: 8px; height: 2px; background-color: var(--lcd-text); }
    .mppt-line-slash { font-size: 11px; line-height: 1; margin-top: -4px; }

    .battery-block { width: 32px; height: 48px; border: 2px solid var(--lcd-text); position: relative; padding: 3px; display: flex; flex-direction: column-reverse; gap: 2px; }
    .battery-block::before { content: ""; position: absolute; top: -6px; left: 6px; width: 16px; height: 4px; background-color: var(--lcd-text); }
    .battery-bar { width: 100%; height: 6px; background-color: var(--lcd-text); }
    .connection-line { flex-grow: 1; height: 2px; background-color: var(--lcd-text); margin: 0 5px; position: relative; }
    .connection-line.arrow-right::after { content: ""; position: absolute; right: 0; top: -3px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid var(--lcd-text); }
    .load-block { position: absolute; bottom: -15px; right: 4px; display: flex; flex-direction: column; align-items: center; }
    .load-icon-circle { width: 26px; height: 26px; border: 2px solid var(--lcd-text); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; }
    .lcd-row-bottom { display: flex; justify-content: space-between; font-size: 21px; font-weight: bold; line-height: 1.3; border-top: 1.5px solid var(--lcd-text); padding-top: 8px; }
    .led-panel { position: absolute; right: -55px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 25px; align-items: center; }
    @media (max-width: 660px) { .mppt-case { margin-right: 45px; } .led-panel { right: -48px; } }
    .led-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .led-light { width: 14px; height: 14px; border-radius: 50%; background-color: #222; border: 1px solid #000; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
    .led-light.active-green { background-color: #00ff66; box-shadow: 0 0 10px #00ff66, inset 0 2px 2px #fff; }
    .led-light.active-red { background-color: #ff3333; box-shadow: 0 0 10px #ff3333, inset 0 2px 2px #fff; }
    .led-label { font-size: 10px; font-weight: bold; color: #8fa0c2; letter-spacing: 1px; }
    .physical-buttons { display: flex; justify-content: space-around; margin-top: 30px; padding: 0 10px; }
    .btn-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .round-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #283759 0%, #151f33 100%); border: 3px solid #0b111e; box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: center; align-items: center; color: #8fa0c2; font-size: 14px; }
    .round-btn:active { background: #151f33; box-shadow: inset 0 3px 5px rgba(0,0,0,0.8); }
    .btn-label { font-size: 12px; font-weight: bold; color: #8fa0c2; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="mppt-case">
    <div class="lcd-screen">
      <div class="lcd-row-top"><span id="txt-datetime">2026-11-03 03:45:26</span></div>
      <div class="lcd-row-subtop">
        <div><span id="val-vpv">0</span>U</div>
        <div><span id="val-vbat">49.0</span>V</div>
      </div>
      <div class="lcd-diagram-area">
        <div class="pv-block">
          <div class="pv-element"><div class="pv-cell"></div><div class="pv-cell"></div><div class="pv-cell"></div></div>
          <div class="pv-element"><div class="pv-cell"></div><div class="pv-cell"></div><div class="pv-cell"></div></div>
          <div class="pv-element"><div class="pv-cell"></div><div class="pv-cell"></div><div class="pv-cell"></div></div>
        </div>
        <div class="connection-line arrow-right"></div>
        <div class="mppt-center-box">
          <div>MPPT</div>
          <div class="mppt-internal-lines">
            <div class="mppt-line-segment"></div>
            <div class="mppt-line-slash">/</div>
            <div class="mppt-line-segment"></div>
          </div>
        </div>
        <div class="connection-line arrow-right"></div>
        <div class="battery-block">
          <div class="battery-bar"></div><div class="battery-bar"></div><div class="battery-bar"></div><div class="battery-bar"></div><div class="battery-bar"></div>
        </div>
        <div class="load-block"><div class="load-icon-circle">W</div></div>
      </div>
      <div class="lcd-row-bottom">
        <div>I\$ <span id="val-current">0.0</span>A &nbsp;<span id="val-status">0x20</span></div>
        <div>D\$ <span id="val-total">000.000</span>kWh</div>
      </div>
    </div>

        <div class="led-panel">
      <div class="led-group"><div class="led-light" id="led-alarm"></div><div class="led-label">ALARM</div></div>
      <div class="led-group"><div class="led-light active-green" id="led-charge"></div><div class="led-label">CHARGE</div></div>
      <div class="led-group"><div class="led-light" id="led-load"></div><div class="led-label">LOAD</div></div>
    </div>
    <div class="physical-buttons">
      <div class="btn-group"><div class="round-btn">⟳</div><div class="btn-label">ESC</div></div>
      <div class="btn-group"><div class="round-btn">▲</div><div class="btn-label">UP</div></div>
      <div class="btn-group"><div class="round-btn">▼</div><div class="btn-label">DOWN</div></div>
      <div class="btn-group"><div class="round-btn">⚙</div><div class="btn-label">FUNCTION</div></div>
    </div>
  </div>
  <script>
    function updateSensorData(data) {
      if(data.time) document.getElementById('txt-datetime').innerText = data.time;
      if(data.vpv !== undefined) document.getElementById('val-vpv').innerText = Math.round(data.vpv);
      if(data.vbat !== undefined) document.getElementById('val-vbat').innerText = data.vbat.toFixed(1);
      if(data.current !== undefined) document.getElementById('val-current').innerText = data.current.toFixed(1);
      if(data.status_code !== undefined) {
        let hexStatus = "0x" + parseInt(data.status_code).toString(16).toUpperCase();
        document.getElementById('val-status').innerText = hexStatus;
      }
      if(data.total !== undefined) {
        let formattedTotal = data.total.toFixed(3);
        if(data.total < 100) formattedTotal = "0" + formattedTotal;
        if(data.total < 10) formattedTotal = "0" + formattedTotal;
        document.getElementById('val-total').innerText = formattedTotal;
      }
      const ledCharge = document.getElementById('led-charge');
      if(data.current > 0) { ledCharge.classList.add('active-green'); } else { ledCharge.classList.remove('active-green'); }
    }
    window.addEventListener('DOMContentLoaded', () => {
      updateSensorData({
        time: "2026-11-03 03:45:26",
        vpv: 0,
        vbat: 49.0,
        current: 0.0,
        status_code: 32,
        total: 0.000
      });
    });
  </script>
</body>
</html>

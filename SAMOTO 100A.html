<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPT SOLAR MONITORING - DASHBOARD</title>
    
    <!-- Google Fonts: Inter & VT323 (Font LCD Digital) -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        /* CSS MURNI UNTUK MENJAMIN STABILITAS DI GITHUB PAGES */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #FFFFFF; 
            min-height: 100vh; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #161B22;
            border: 1px solid #30363D;
            border-radius: 16px;
            padding: 24px;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        header {
            border-b: 1px solid #30363D;
            padding-bottom: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 { font-size: 28px; font-weight: 800; letter-spacing: 1px; color: #FFFFFF; }
        header h2 { font-size: 14px; font-weight: 300; color: #FF7F00; margin-top: 4px; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #000000;
            border: 1px solid #30363D;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
        }

        .status-left { display: flex; align-items: center; gap: 8px; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; background-color: #EF4444; }
        .indicator.connected { background-color: #00FF00; box-shadow: 0 0 8px #00FF00; }

        /* BINGKAI UTAMA LCD SAMOTO */
        .lcd-outer-frame {
            width: 100%;
            max-width: 550px;
            margin: 20px auto;
            padding: 16px;
            background-color: #141923;
            border: 4px solid #0b111e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .lcd-screen {
            position: relative;
            background-color: #0033cc;
            border: 14px solid #0a0f1d;
            padding: 20px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
            font-family: 'VT323', monospace;
            color: #00FFFF;
            text-shadow: 0 0 6px rgba(0, 255, 255, 0.7);
            user-select: none;
        }

        .lcd-row-1 { display: flex; justify-content: space-between; font-size: 26px; border-bottom: 1px dashed rgba(0,255,255,0.3); padding-bottom: 4px; }
        .lcd-row-2 { display: flex; justify-content: space-between; font-size: 45px; margin-top: 10px; padding: 0 10px; font-weight: bold; }
        
        /* DIAGRAM DAYA LCD */
        .lcd-diagram { position: relative; display: flex; justify-content: space-between; items-center: center; margin: 20px 0; height: 110px; padding: 0 10px; }
        
        .icon-pv { display: flex; flex-direction: column; justify-content: space-between; h-height: 80px; width: 55px; border: 2px solid #00FFFF; padding: 4px; background-color: #0033cc; margin-top: 10px; }
        .pv-line { border: 1px solid #00FFFF; height: 16px; background-color: rgba(0,255,255,0.1); }

        .line-pv-to-mppt { position: absolute; left: 65px; top: 50px; width: 65px; height: 0px; border-top: 2px dashed #00FFFF; }

        .icon-mppt { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 120px; height: 80px; border: 2px solid #00FFFF; background-color: #0033cc; padding: 6px 0; margin-top: 10px; }
        .mppt-title { font-size: 28px; font-weight: bold; border-bottom: 2px solid #00FFFF; w-width: 100%; text-align: center; padding-bottom: 2px; width: 100%; }
        .mppt-sub { display: flex; justify-content: space-around; width: 100%; font-size: 16px; }

        .line-mppt-to-bat { position: absolute; right: 65px; top: 40px; width: 65px; height: 0px; border-top: 2px solid #00FFFF; }
        .line-mppt-to-load { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 0px; height: 20px; border-left: 2px solid #00FFFF; }

        .icon-bat { position: relative; width: 55px; height: 48px; border: 2px solid #00FFFF; border-radius: 2px; padding: 2px; display: flex; flex-direction: column; justify-content: flex-end; margin-top: 15px; }
        .bat-cap { absolute: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 16px; height: 4px; background-color: #00FFFF; }
        .bat-bar { width: 100%; background-color: #00FFFF; transition: height 0.5s; height: 0%; }

        .icon-load { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 2px solid #00FFFF; border-radius: 50%; background-color: #0033cc; font-size: 22px; }

        /* PARAMETER BAWAH LCD */
        .lcd-row-4 { display: grid; grid-template-columns: 1fr 1fr; font-size: 30px; border-top: 1px dashed rgba(0,255,255,0.3); padding-top: 8px; }
        .param-left { display: flex; flex-direction: column; gap: 2px; }
        .param-right { text-align: right; display: flex; flex-direction: column; justify-content: space-between; }
        .brand-text { font-family: 'Inter', sans-serif; font-size: 15px; opacity: 0.4; }

        /* AREA GRAFIK & KONTROL */
        .chart-section { background-color: #000000; border: 1px solid #30363D; border-radius: 12px; padding: 16px; margin-top: 20px; position: relative; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363D; padding-bottom: 8px; margin-bottom: 12px; }
        .chart-container { position: relative; height: 300px; width: 100%; }

        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 20px; padding: 16px; background-color: #000000; border: 1px solid #30363D; border-radius: 12px; }
        @media (min-width: 768px) { .controls-grid { grid-template-columns: 1fr 2fr; } }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-group label { font-size: 14px; color: #8B949E; }
        .btn-group input { padding: 10px; background-color: #0D1117; border: 1px solid #30363D; color: white; border-radius: 6px; text-align: center; font-family: monospace; }
        
        button { padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: none; }
        .btn-main { background-color: #FF7F00; color: #000000; }
        .btn-main:hover { background-color: #ff9533; }
        .btn-sub { background-color: transparent; border: 1px solid #FF7F00; color: #FF7F00; }
        .btn-sub:hover { background-color: #FF7F00; color: #000000; }

        .checkbox-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; color: #C9D1D9; }
        .checkbox-item { display: flex; align-items: center; padding: 8px; background-color: #161B22; border: 1px solid #30363D; border-radius: 6px; }
        .checkbox-item input { margin-right: 8px; width: 16px; height: 16px; }

        footer { text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #30363D; font-size: 12px; color: #8B949E; }
        footer a { color: #FF7F00; text-decoration: none; }
        
        #loader { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; display: none; }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>MPPT SAMOTO 100A MONITORING</h1>
            <h2>Pelacakan Kinerja Energi Surya Real-Time By Rezky Logam</h2>
            
            <div class="status-bar">
                <div class="status-left">
                    <div id="mqtt-indicator" class="indicator"></div>
                    <span id="mqtt-status-text">Connecting to Server...</span>
                </div>
                <div>
                    Last Update: <span id="update-time" style="color: #FFFFFF;">Just now</span>
                </div>
            </div>
        </header>

        <!-- REPLIKA LAYAR LCD FISIK -->
        <div class="lcd-outer-frame">
            <div class="lcd-screen">
                <div class="lcd-row-1">
                    <span id="lcd-date">2026-11-03</span>
                    <span id="lcd-time">07:32:25</span>
                </div>

                <div class="lcd-row-2">
                    <div><span id="lcd-vpv">0</span>V</div>
                    <div><span id="lcd-vbat">0.0</span>V</div>
                </div>

                <div class="lcd-diagram">
                    <div class="icon-pv">
                        <div class="pv-line"></div>
                        <div class="pv-line"></div>
                        <div class="pv-line"></div>
                    </div>

                    <div class="line-pv-to-mppt"></div>

                    <div class="icon-mppt">
